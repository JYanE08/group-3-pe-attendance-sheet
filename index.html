<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GROUP 03 • PE TRACKER</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;800&family=Space+Grotesk:wght@500;700;800;900&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

  <style>
    body {
      font-family: 'Space Grotesk', sans-serif;
      background-color: #0A0C10;
      color: #F3F4F6;
    }
    .font-mono-custom { font-family: 'JetBrains Mono', monospace; }
    
    /* Background Pattern */
    .bg-grid {
      background-size: 40px 40px;
      background-image: linear-gradient(to right, rgba(255, 255, 255, 0.02) 1px, transparent 1px),
                        linear-gradient(to bottom, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
    }
    
    /* Premium Blurs */
    .glass {
      background: rgba(15, 18, 25, 0.7);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.06);
    }

    /* Staggered Load Animation */
    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .animate-item {
      opacity: 0;
      animation: fadeInUp 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    /* Data Bar Fill */
    .data-bar-fill { transition: width 0.8s cubic-bezier(0.65, 0, 0.35, 1); }

    /* Indicator Dots */
    .dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }

    @media print {
      body { background: #fff !important; color: #000 !important; }
      .no-print, header, section:not(#printArea), .bg-grid { display: none !important; }
      #printArea { display: block !important; }
    }
  </style>
</head>
<body class="min-h-screen bg-grid selection:bg-orange-500 selection:text-black">

  <!-- ========================================== -->
  <!-- 1: MINIMAL LANDING                         -->
  <!-- ========================================== -->
  <section id="landingView" class="h-screen flex flex-col justify-center items-center relative z-10 px-6">
    <div class="text-center space-y-8 max-w-lg">
      <div>
        <div class="inline-flex items-center gap-2 mb-2 font-mono-custom text-xs tracking-widest text-stone-500 uppercase">
          <span class="w-2 h-2 bg-emerald-500 rounded-full animate-pulse"></span>
          GROUP 03
        </div>
        <h1 class="text-6xl sm:text-7xl font-black uppercase text-white tracking-tighter leading-none mb-4">
          TRACKER
        </h1>
        <div class="flex flex-wrap justify-center gap-3 text-[10px] font-mono-custom font-bold text-stone-400">
          <span class="px-2 py-1 rounded bg-white/5 border border-white/10">3 LATES = 1 ABSENT</span>
          <span class="px-2 py-1 rounded bg-white/5 border border-white/10">3 ABSENTS = DROP</span>
          <span class="px-2 py-1 rounded bg-white/5 border border-white/10">20 MIN GRACE</span>
        </div>
      </div>

      <div class="flex gap-4 justify-center">
        <button onclick="navigateTo('dashboard')" class="py-4 w-40 rounded-xl bg-white hover:bg-stone-200 text-black font-extrabold text-sm uppercase transition shadow-[0_0_20px_rgba(255,255,255,0.2)]">
          ENTER
        </button>
        <button onclick="openAuthModal()" class="py-4 w-40 rounded-xl glass hover:bg-white/10 text-white font-extrabold text-sm uppercase transition border border-white/20">
          ADMIN ACCESS
        </button>
      </div>
    </div>
  </section>

  <!-- ========================================== -->
  <!-- 2: DASHBOARD (LIVE DATA)                   -->
  <!-- ========================================== -->
  <section id="dashboardView" class="hidden min-h-screen pb-16">
    <header class="glass sticky top-0 z-30">
      <div class="max-w-7xl mx-auto px-6 py-4 flex justify-between items-center">
        <button onclick="navigateTo('landing')" class="text-xs font-mono-custom font-bold text-stone-500 hover:text-white transition uppercase">
          ← Back
        </button>
        
        <div class="flex items-center gap-3 font-mono-custom text-xs uppercase font-bold text-stone-300">
          <!-- Legend -->
          <div class="hidden sm:flex gap-3 px-4 py-1.5 rounded-md bg-black/40 border border-white/5">
            <span class="flex items-center gap-1.5"><span class="dot bg-stone-500"></span>NONE</span>
            <span class="flex items-center gap-1.5"><span class="dot bg-emerald-400"></span>OK</span>
            <span class="flex items-center gap-1.5"><span class="dot bg-amber-400"></span>WARNING</span>
            <span class="flex items-center gap-1.5"><span class="dot bg-rose-500 shadow-[0_0_8px_#f43f5e]"></span>DROPPED</span>
          </div>
        </div>

        <div class="flex items-center gap-2">
          <!-- Layout Toggles -->
          <div class="flex bg-black/50 border border-white/10 rounded-lg p-0.5">
            <button id="btnGrid" onclick="toggleLayout('grid')" class="p-1.5 px-3 rounded text-white bg-white/10 text-xs font-mono-custom transition">GRID</button>
            <button id="btnList" onclick="toggleLayout('list')" class="p-1.5 px-3 rounded text-stone-500 hover:text-white text-xs font-mono-custom transition">LIST</button>
          </div>
          <button onclick="openExportModal()" class="text-xs font-mono-custom font-bold px-4 py-2 rounded-lg bg-white text-black transition">
            EXPORT 📸
          </button>
        </div>
      </div>
    </header>

    <main class="max-w-7xl mx-auto px-6 py-8 space-y-6">
      <!-- Live Metrics Dashboard Header -->
      <div class="flex justify-between items-end border-b border-white/10 pb-4">
        <h2 class="text-3xl font-black uppercase tracking-tight text-white">Live Roster</h2>
        <div id="rosterStatsBanner" class="text-xs font-mono-custom flex gap-4 text-stone-400 uppercase font-bold tracking-wider">
          -- Data --
        </div>
      </div>

      <!-- Content Container -->
      <div id="membersContainer" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
        <!-- Rendered via JS -->
      </div>
    </main>
  </section>

  <!-- ========================================== -->
  <!-- 3: ADMIN CONSOLE                           -->
  <!-- ========================================== -->
  <section id="adminView" class="hidden min-h-screen pb-16">
    <header class="glass sticky top-0 z-30">
      <div class="max-w-7xl mx-auto px-6 py-4 flex justify-between items-center">
        <button onclick="navigateTo('dashboard')" class="text-xs font-mono-custom font-bold text-stone-400 hover:text-white uppercase transition">
          ← DASHBOARD
        </button>
        <span class="text-xs font-mono-custom font-bold uppercase text-amber-400 tracking-widest bg-amber-500/10 px-3 py-1 rounded">
          LEADER CONSOLE
        </span>
        <button onclick="logoutAdmin()" class="text-xs font-mono-custom font-bold text-rose-400 uppercase hover:text-rose-300">
          LOGOUT
        </button>
      </div>
    </header>

    <main class="max-w-4xl mx-auto px-6 py-8 space-y-6">
      
      <!-- Section 1: Session Log -->
      <div class="glass rounded-xl p-6 space-y-5">
        <div class="flex justify-between items-center">
          <h3 class="font-bold uppercase tracking-tight text-white">Log Practice</h3>
          <button onclick="markAllPresent()" class="text-xs font-mono-custom bg-emerald-500/10 text-emerald-400 border border-emerald-500/30 px-3 py-1.5 rounded uppercase font-bold transition hover:bg-emerald-500/20">
            MARK ALL OK
          </button>
        </div>

        <div class="grid grid-cols-2 sm:grid-cols-4 gap-4 text-xs font-mono-custom uppercase font-bold">
          <div>
            <label class="text-stone-500 mb-1 block">Label</label>
            <input id="sessionLabel" type="text" placeholder="Day 1" class="w-full bg-black/50 border border-white/10 px-3 py-2 rounded text-white" />
          </div>
          <div>
            <label class="text-stone-500 mb-1 block">Date</label>
            <input id="sessionDate" type="date" class="w-full bg-black/50 border border-white/10 px-3 py-2 rounded text-white" />
          </div>
          <div>
            <label class="text-stone-500 mb-1 block">Call Time</label>
            <input id="sessionStart" type="time" value="16:00" class="w-full bg-black/50 border border-white/10 px-3 py-2 rounded text-white" />
          </div>
          <div>
            <label class="text-stone-500 mb-1 block">End Time</label>
            <input id="sessionEnd" type="time" value="18:00" class="w-full bg-black/50 border border-white/10 px-3 py-2 rounded text-white" />
          </div>
        </div>

        <div class="overflow-x-auto border border-white/5 rounded-lg">
          <table class="w-full text-left text-xs font-mono-custom">
            <thead class="text-stone-500 uppercase border-b border-white/5 bg-black/20">
              <tr>
                <th class="p-3">Name</th>
                <th class="p-3 w-40">Status</th>
                <th class="p-3 w-32">Time In</th>
              </tr>
            </thead>
            <tbody id="attendanceInputList" class="divide-y divide-white/5"></tbody>
          </table>
        </div>

        <button onclick="savePracticeSession()" class="w-full bg-orange-600 hover:bg-orange-500 text-white font-extrabold uppercase py-3 rounded text-sm transition">
          SAVE ATTENDANCE
        </button>
      </div>

      <div class="grid grid-cols-1 sm:grid-cols-2 gap-6">
        <div class="glass rounded-xl p-5 space-y-3">
          <h3 class="font-bold uppercase tracking-tight text-white">Add Member</h3>
          <div class="flex gap-2">
            <input id="newMemberName" type="text" placeholder="Name..." class="flex-1 bg-black/50 border border-white/10 px-3 rounded text-sm font-mono-custom text-white outline-none focus:border-stone-500" />
            <button onclick="addMember()" class="bg-white text-black px-4 font-bold rounded uppercase text-xs">ADD</button>
          </div>
        </div>
        
        <div class="glass rounded-xl p-5 space-y-3">
          <h3 class="font-bold uppercase tracking-tight text-white">Edit Records</h3>
          <div id="pastSessionsList" class="space-y-1 h-32 overflow-y-auto pr-2"></div>
        </div>
      </div>
    </main>
  </section>

  <!-- ========================================== -->
  <!-- MODAL: EXPORT / GC SHARING                 -->
  <!-- ========================================== -->
  <div id="exportModal" class="hidden fixed inset-0 z-50 bg-black/90 flex items-center justify-center p-4 backdrop-blur-sm">
    <div class="w-full max-w-2xl bg-black border border-white/15 p-1 rounded-2xl">
      <div class="p-5 flex justify-between items-center border-b border-white/10">
        <select id="exportSessionSelector" onchange="generateExportCard()" class="bg-stone-900 border border-white/10 text-white font-mono-custom text-xs px-3 py-1.5 rounded outline-none uppercase font-bold max-w-[200px]">
          <option value="overall">SUMMARY ALL</option>
        </select>
        <div class="flex gap-2">
          <button onclick="downloadAsImage()" class="bg-emerald-500 text-black px-4 py-2 rounded text-xs font-mono-custom font-bold">⬇ .PNG (IMAGE)</button>
          <button onclick="closeExportModal()" class="text-stone-500 hover:text-white px-2">X</button>
        </div>
      </div>
      
      <div class="p-4 overflow-y-auto max-h-[70vh]">
        <div id="exportCardArea" class="bg-[#0f1115] border border-white/5 rounded-xl p-6 text-white">
          <div class="border-b border-white/10 pb-4 mb-4 flex justify-between">
            <div>
              <div class="font-mono-custom text-[10px] text-stone-500 uppercase tracking-widest mb-1">GROUP 03 ATTENDANCE</div>
              <h2 id="exportTitle" class="text-3xl font-black uppercase tracking-tight">SUMMARY</h2>
            </div>
            <div id="exportTimestamp" class="font-mono-custom text-xs text-stone-500 text-right"></div>
          </div>
          <div id="exportContentList" class="font-mono-custom text-xs space-y-[2px]"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- ========================================== -->
  <!-- MODAL: RECEIPT (TIMELINE)                  -->
  <!-- ========================================== -->
  <div id="receiptModal" class="hidden fixed inset-0 z-50 bg-black/90 flex items-center justify-center p-4 backdrop-blur-sm">
    <div class="glass w-full max-w-md rounded-2xl flex flex-col max-h-[85vh] border border-white/10 shadow-2xl">
      <div class="p-5 flex justify-between border-b border-white/10">
        <h3 id="receiptName" class="text-xl font-black uppercase tracking-tight">NAME</h3>
        <button onclick="closeReceiptModal()" class="text-stone-500 font-bold hover:text-white">X</button>
      </div>
      
      <div class="p-5 grid grid-cols-3 gap-2 font-mono-custom text-center">
        <div class="bg-black/40 rounded p-2 border border-white/5">
          <span class="block text-[10px] text-stone-500 mb-1">PRESENTS</span>
          <span id="rPresents" class="text-xl text-emerald-400 font-bold">0</span>
        </div>
        <div class="bg-black/40 rounded p-2 border border-white/5">
          <span class="block text-[10px] text-stone-500 mb-1">LATES</span>
          <span id="rLates" class="text-xl text-amber-400 font-bold">0</span>
        </div>
        <div class="bg-black/40 rounded p-2 border border-white/5">
          <span class="block text-[10px] text-stone-500 mb-1">ABSENTS</span>
          <span id="rAbsents" class="text-xl text-rose-500 font-bold shadow-[0_0_5px_rgba(244,63,94,0.5)]">0</span>
        </div>
      </div>

      <div class="flex-1 overflow-y-auto px-5 pb-5">
        <div id="receiptTimeline" class="space-y-1 font-mono-custom text-[11px] uppercase"></div>
      </div>
    </div>
  </div>

  <!-- ========================================== -->
  <!-- MODAL: LOGIN                               -->
  <!-- ========================================== -->
  <div id="authModal" class="hidden fixed inset-0 z-50 bg-black/90 flex items-center justify-center p-4 backdrop-blur-sm">
    <div class="glass border border-white/10 w-full max-w-sm p-6 rounded-2xl space-y-4 shadow-2xl">
      <div class="flex justify-between text-white uppercase font-bold text-sm font-mono-custom mb-2">
        <span>LEADER ACCESS</span>
        <button onclick="closeAuthModal()" class="text-stone-500 hover:text-white">X</button>
      </div>
      <input id="loginEmail" type="email" placeholder="EMAIL" class="w-full bg-black border border-white/10 p-3 text-xs font-mono-custom text-white outline-none rounded" />
      <input id="loginPassword" type="password" placeholder="PASSWORD" class="w-full bg-black border border-white/10 p-3 text-xs font-mono-custom text-white outline-none rounded" />
      <button onclick="loginAdmin()" class="w-full bg-white text-black font-extrabold uppercase py-3 rounded text-sm mt-2 transition shadow-md shadow-white/10">AUTHORIZE</button>
    </div>
  </div>

  <!-- ========================================== -->
  <!-- JAVASCRIPT & FIREBASE                      -->
  <!-- ========================================== -->
  <script>
    // ---------------------------------------------------------
    // PASTE YOUR FIREBASE KEYS HERE
    // ---------------------------------------------------------
    const firebaseConfig = {
  apiKey: "AIzaSyD29Zqlz1Oe9dNZuLX4h7jywOadUtJ5jOY",
  authDomain: "group-3-pe-attendance-sheet.firebaseapp.com",
  projectId: "group-3-pe-attendance-sheet",
  storageBucket: "group-3-pe-attendance-sheet.firebasestorage.app",
  messagingSenderId: "316207692658",
  appId: "1:316207692658:web:a46c47a6f8ccce2635bbeb"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();

    let members = [], sessions = [], attendance = [];
    let currentUser = null, currentLayout = 'grid';

    document.getElementById('sessionDate').valueAsDate = new Date();

    // VIEW LOGIC
    function navigateTo(view) {
      document.querySelectorAll('section').forEach(s => s.classList.add('hidden'));
      if (view === 'admin' && !currentUser) return openAuthModal();
      document.getElementById(view + 'View').classList.remove('hidden');
    }

    // AUTH
    auth.onAuthStateChanged(user => { currentUser = user; });
    function openAuthModal() { currentUser ? navigateTo('admin') : document.getElementById('authModal').classList.remove('hidden'); }
    function closeAuthModal() { document.getElementById('authModal').classList.add('hidden'); }
    async function loginAdmin() {
      try {
        await auth.signInWithEmailAndPassword(document.getElementById('loginEmail').value.trim(), document.getElementById('loginPassword').value);
        closeAuthModal(); navigateTo('admin');
      } catch (e) { alert("Auth Error: " + e.message); }
    }
    function logoutAdmin() { auth.signOut(); navigateTo('landing'); }

    // DATABASE LISTENERS
    db.collection('members').orderBy('name', 'asc').onSnapshot(s => { members = s.docs.map(d => ({id: d.id, ...d.data()})); renderUI(); });
    db.collection('sessions').orderBy('date', 'desc').onSnapshot(s => { sessions = s.docs.map(d => ({id: d.id, ...d.data()})); renderUI(); renderPastSessions(); updateExportSelectors(); });
    db.collection('attendance').onSnapshot(s => { attendance = s.docs.map(d => ({id: d.id, ...d.data()})); renderUI(); });

    function renderUI() {
      renderRoster();
      renderAttendanceForm();
    }

    // MEMBER MGT
    async function addMember() {
      const name = document.getElementById('newMemberName').value.trim();
      if (!name) return;
      await db.collection('members').add({ name, createdAt: firebase.firestore.FieldValue.serverTimestamp() });
      document.getElementById('newMemberName').value = '';
    }

    // ADMIN - LOGGING (WITH 20 MIN AUTO-MATH)
    function renderAttendanceForm() {
      document.getElementById('attendanceInputList').innerHTML = members.map(m => `
        <tr class="hover:bg-white/[0.03]">
          <td class="p-3 text-stone-200">${m.name}</td>
          <td class="p-3">
            <select id="status_${m.id}" onchange="handleStatusChange('${m.id}')" class="w-full bg-black border border-white/20 text-white rounded p-1 outline-none font-bold">
              <option value="present">🟢 OK</option>
              <option value="late">🟠 LATE (>20M)</option>
              <option value="absent">🔴 ABSENT</option>
            </select>
          </td>
          <td class="p-3">
            <input id="time_${m.id}" type="time" onchange="autoLateCheck('${m.id}')" value="${document.getElementById('sessionStart').value}" class="w-full bg-black border border-white/20 text-stone-300 rounded p-1 outline-none" />
          </td>
        </tr>
      `).join('');
    }

    function autoLateCheck(id) {
      const start = document.getElementById('sessionStart').value;
      const arr = document.getElementById('time_' + id).value;
      const sel = document.getElementById('status_' + id);
      if (sel.value === 'absent' || !start || !arr) return;
      
      const [sh, sm] = start.split(':').map(Number);
      const [ah, am] = arr.split(':').map(Number);
      const diff = (ah * 60 + am) - (sh * 60 + sm);
      
      sel.value = diff > 20 ? 'late' : 'present';
    }

    function handleStatusChange(id) {
      const t = document.getElementById('time_' + id);
      if (document.getElementById('status_' + id).value === 'absent') { t.disabled = true; t.value = ''; }
      else { t.disabled = false; if(!t.value) t.value = document.getElementById('sessionStart').value; }
    }
    
    function markAllPresent() { members.forEach(m => { const s=document.getElementById('status_'+m.id), t=document.getElementById('time_'+m.id); if(s)s.value='present'; if(t){t.disabled=false; t.value=document.getElementById('sessionStart').value;} }); }

    async function savePracticeSession() {
      const label = document.getElementById('sessionLabel').value || 'PRACTICE';
      const date = document.getElementById('sessionDate').value, st = document.getElementById('sessionStart').value, en = document.getElementById('sessionEnd').value;
      if (!date || members.length===0) return;

      const batch = db.batch();
      const sRef = db.collection('sessions').doc();
      batch.set(sRef, { label, date, startTime: st, endTime: en });

      members.forEach(m => {
        const stat = document.getElementById('status_'+m.id).value;
        const tm = document.getElementById('time_'+m.id).value || 'N/A';
        batch.set(db.collection('attendance').doc(), { sessionId: sRef.id, sessionLabel: label, date, memberId: m.id, memberName: m.name, status: stat, timeArrived: stat === 'absent' ? 'N/A' : tm });
      });
      await batch.commit(); alert('SAVED!');
    }

    // ADMIN - PAST RECORDS
    function renderPastSessions() {
      document.getElementById('pastSessionsList').innerHTML = sessions.slice(0,5).map(s => `
        <div class="flex justify-between items-center text-[10px] font-mono-custom uppercase bg-black/30 p-2 rounded border border-white/5">
          <span class="text-stone-300">${s.date} : ${s.label}</span>
          <button onclick="editRecords('${s.id}')" class="text-white bg-white/10 px-2 rounded hover:bg-white/20">EDIT</button>
        </div>
      `).join('');
    }

    async function editRecords(sId) {
      const target = prompt(`EDIT DATA.\nEnter MEMBER NAME:`).trim();
      const rec = attendance.find(a => a.sessionId === sId && a.memberName.toLowerCase() === target.toLowerCase());
      if (!rec) return alert('Member not found in session.');
      const nS = prompt(`NEW STATUS (present / late / absent)`, rec.status);
      const nT = nS !== 'absent' ? (prompt(`TIME IN`, rec.timeArrived) || 'N/A') : 'N/A';
      if (['present','late','absent'].includes(nS.toLowerCase())) {
        await db.collection('attendance').doc(rec.id).update({ status: nS, timeArrived: nT });
      }
    }

    // CORE: LIVE ROSTER VIEW & MATH
    function getStats(mId) {
      const logs = attendance.filter(a => a.memberId === mId);
      const P = logs.filter(a => a.status === 'present').length, L = logs.filter(a => a.status === 'late').length, A = logs.filter(a => a.status === 'absent').length;
      const totalA = A + Math.floor(L/3);
      let s = sessions.length ? (totalA >= 3 ? 'drop' : (totalA === 2 ? 'warn' : 'ok')) : 'none';
      return { P, L, totalA, status: s, logs };
    }

    function toggleLayout(type) {
      currentLayout = type;
      document.getElementById('btnGrid').className = type === 'grid' ? "p-1.5 px-3 rounded text-white bg-white/10 text-xs font-mono-custom transition" : "p-1.5 px-3 rounded text-stone-500 hover:text-white text-xs font-mono-custom transition";
      document.getElementById('btnList').className = type === 'list' ? "p-1.5 px-3 rounded text-white bg-white/10 text-xs font-mono-custom transition" : "p-1.5 px-3 rounded text-stone-500 hover:text-white text-xs font-mono-custom transition";
      
      const cont = document.getElementById('membersContainer');
      cont.className = type === 'grid' ? "grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4" : "flex flex-col gap-2 max-w-4xl mx-auto w-full";
      renderRoster();
    }

    function renderRoster() {
      const c = document.getElementById('membersContainer'), s = document.getElementById('rosterStatsBanner');
      if (members.length === 0) return c.innerHTML = '', s.innerHTML = '';
      let counts = {ok:0, warn:0, drop:0};

      c.innerHTML = members.map((m, i) => {
        const st = getStats(m.id);
        if(st.status==='ok')counts.ok++; if(st.status==='warn')counts.warn++; if(st.status==='drop')counts.drop++;
        
        let cClr='bg-stone-500', bar=0, txt="NONE";
        if(st.status==='ok') {cClr='bg-emerald-400'; bar = st.totalA === 1 ? 33 : 0; txt="OK";}
        if(st.status==='warn'){cClr='bg-amber-400'; bar=66; txt="WARNING";}
        if(st.status==='drop'){cClr='bg-rose-500 shadow-[0_0_8px_#f43f5e]'; bar=100; txt="DROPPED";}

        // LIST VIEW
        if (currentLayout === 'list') {
          return `
            <div class="glass hover:bg-white/[0.05] p-3 rounded-lg flex items-center justify-between cursor-pointer animate-item border border-white/5 transition group" style="animation-delay: ${i*0.03}s" onclick="openRModal('${m.id}')">
              <div class="flex items-center gap-4 min-w-[200px]">
                <div class="dot ${cClr}"></div>
                <div class="font-bold text-white uppercase text-sm">${m.name}</div>
              </div>
              <div class="hidden sm:flex gap-4 font-mono-custom text-xs">
                <span class="text-stone-400">P:<span class="text-emerald-400 font-bold ml-1">${st.P}</span></span>
                <span class="text-stone-400">L:<span class="text-amber-400 font-bold ml-1">${st.L}</span></span>
              </div>
              <div class="flex items-center gap-3 w-40 justify-end">
                <div class="text-[10px] font-mono-custom font-bold text-white">${st.totalA}/3 <span class="text-stone-500">ABS</span></div>
                <div class="w-16 h-1.5 bg-black rounded-full overflow-hidden border border-white/10"><div class="h-full bg-white transition-all" style="width:${bar}%"></div></div>
              </div>
            </div>`;
        } 
        
        // GRID VIEW
        return `
          <div class="glass rounded-xl p-5 hover:translate-y-[-4px] hover:shadow-2xl transition cursor-pointer animate-item group relative overflow-hidden" style="animation-delay: ${i*0.04}s" onclick="openRModal('${m.id}')">
            <div class="absolute top-0 left-0 h-1 bg-white data-bar-fill opacity-20" style="width:${bar}%"></div>
            <div class="flex justify-between items-start mb-4">
              <h3 class="text-lg font-black uppercase text-white tracking-tight break-all">${m.name}</h3>
              <div class="px-2.5 py-1 rounded bg-black/40 border border-white/10 flex items-center gap-2 font-mono-custom text-[10px] font-bold tracking-wider">
                <span class="dot ${cClr}"></span>${txt}
              </div>
            </div>
            <div class="grid grid-cols-3 gap-2 text-center font-mono-custom">
              <div class="bg-white/5 p-2 rounded">
                <div class="text-[9px] text-stone-500">P</div><div class="text-sm font-bold text-emerald-400">${st.P}</div>
              </div>
              <div class="bg-white/5 p-2 rounded">
                <div class="text-[9px] text-stone-500">L</div><div class="text-sm font-bold text-amber-400">${st.L}</div>
              </div>
              <div class="bg-white/5 p-2 rounded">
                <div class="text-[9px] text-stone-500">ABS</div><div class="text-sm font-bold text-rose-500">${st.totalA}</div>
              </div>
            </div>
          </div>`;
      }).join('');

      s.innerHTML = `<span>👥 ${members.length} MEM</span> <span class="text-emerald-400">🟢 ${counts.ok} OK</span> <span class="text-amber-400">🟠 ${counts.warn} WARN</span> <span class="text-rose-500">🔴 ${counts.drop} DROP</span>`;
    }

    // INDIVIDUAL MODAL
    function openRModal(id) {
      const m = members.find(x => x.id === id); if(!m) return;
      const s = getStats(id);
      document.getElementById('receiptName').innerText = m.name;
      document.getElementById('rPresents').innerText = s.P;
      document.getElementById('rLates').innerText = s.L;
      document.getElementById('rAbsents').innerText = s.totalA;
      
      const tl = document.getElementById('receiptTimeline');
      tl.innerHTML = s.logs.sort((a,b)=>new Date(b.date)-new Date(a.date)).map(l => `
        <div class="flex justify-between border-b border-white/5 py-2">
          <div class="text-stone-400">${l.date} <span class="text-white">${l.timeArrived !== 'N/A' ? '@'+l.timeArrived : ''}</span></div>
          <div class="font-bold ${l.status==='present'?'text-emerald-400':(l.status==='late'?'text-amber-400':'text-rose-500')}">${l.status.toUpperCase()}</div>
        </div>
      `).join('');
      document.getElementById('receiptModal').classList.remove('hidden');
    }
    function closeReceiptModal() { document.getElementById('receiptModal').classList.add('hidden'); }

    // EXPORT PNG
    function updateExportSelectors() {
      const sel = document.getElementById('exportSessionSelector'); if(!sel) return;
      sel.innerHTML = `<option value="overall">SUMMARY ALL</option>` + sessions.map(s => `<option value="${s.id}">${s.date} ${s.label}</option>`).join('');
    }
    function openExportModal() { updateExportSelectors(); generateExportCard(); document.getElementById('exportModal').classList.remove('hidden'); }
    function closeExportModal() { document.getElementById('exportModal').classList.add('hidden'); }

    function generateExportCard() {
      const id = document.getElementById('exportSessionSelector').value, el = document.getElementById('exportContentList');
      document.getElementById('exportTimestamp').innerText = new Date().toLocaleDateString();

      if(id === 'overall') {
        document.getElementById('exportTitle').innerText = 'SUMMARY RECORD';
        el.innerHTML = members.map(m => {
          const s = getStats(m.id);
          let tag = s.status==='drop'?'🔴 DROP':(s.status==='warn'?'🟠 WARN':'🟢 OK');
          return `<div class="flex justify-between p-2 bg-[#1a1d24] rounded text-white border border-white/5">
            <span class="uppercase w-40 overflow-hidden text-ellipsis">${m.name}</span>
            <div class="flex gap-4 w-40 text-[10px] text-stone-400"><span class="w-8">P:${s.P}</span><span class="w-8">L:${s.L}</span><span class="w-8 font-bold text-rose-500">A:${s.totalA}</span></div>
            <span class="font-bold w-16 text-right">${tag}</span>
          </div>`;
        }).join('');
      } else {
        const ses = sessions.find(x => x.id === id); if(!ses) return;
        document.getElementById('exportTitle').innerText = ses.date + ' ' + ses.label;
        el.innerHTML = attendance.filter(a => a.sessionId === id).map(l => {
          let b = l.status==='present'?'🟢 OK':(l.status==='late'?`🟠 LATE`:'🔴 ABSENT');
          return `<div class="flex justify-between p-2 bg-[#1a1d24] rounded text-white border border-white/5"><span class="uppercase">${l.memberName}</span><div class="flex gap-2 items-center"><span class="text-[10px] text-stone-400 mr-2">${l.timeArrived !== 'N/A' ? '@'+l.timeArrived : ''}</span><span class="font-bold">${b}</span></div></div>`;
        }).join('');
      }
    }
    function downloadAsImage() {
      html2canvas(document.getElementById('exportCardArea'), { backgroundColor: '#0f1115', scale: 2 }).then(canvas => {
        const link = document.createElement('a'); link.download = `Record_${Date.now()}.png`; link.href = canvas.toDataURL(); link.click();
      });
    }
  </script>
</body>
</html>
